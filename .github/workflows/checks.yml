name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.15'
          - os: macos-latest
            python: '3.13'
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ github.workspace }}/.cache/matplotlib
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.12.1'
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --locked --extra dev --python '${{ matrix.python }}'
      - name: Verify the pip export matches the lock
        run: |
          uv export --locked --extra dev --no-emit-project --no-hashes --output-file requirements-tested.txt
          git diff --exit-code -- requirements-tested.txt uv.lock
      - name: Lint and formatting
        run: |
          uv run --no-sync python -m ruff check .
          uv run --no-sync python -m black --check .
      - name: Tests, launcher and export
        run: uv run --no-sync python -m pytest -q --durations=10
